services:
  - type: web
    name: fake-job-detector-api
    runtime: docker
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: MODEL_PATH
        value: models/job_detector.pkl
      - key: RISK_MEDIUM_MIN
        value: "0.35"
      - key: RISK_HIGH_MIN
        value: "0.70"
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: fake-job-detector-db
          property: connectionString

databases:
  - name: fake-job-detector-db
    plan: free
